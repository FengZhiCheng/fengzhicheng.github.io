<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="记录阅读、思考与日常微光。" />
    <title>微光札记</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到首页">微光札记</a>
      <nav aria-label="主导航">
        <a href="#notes">文章</a>
        <a href="#categories">分类</a>
        <a href="#about">关于</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <p class="eyebrow">READ · THINK · LIVE</p>
        <h1>把读过的书<br />和走过的路，慢慢写下来。</h1>
        <p class="intro">这里收藏阅读中的停顿、生活里的感受，和那些值得反复想起的片刻。</p>
        <a class="text-link" href="#notes">开始阅读 <span>↓</span></a>
      </section>

      <section class="search-section" aria-label="搜索文章">
        <label for="search">搜索文章</label>
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="书名、主题或关键词" autocomplete="off" />
          <button id="clear-search" type="button" hidden>清除</button>
        </div>
      </section>

      <section id="categories" class="filters" aria-label="文章筛选">
        <div>
          <p class="section-kicker">BROWSE</p>
          <h2>按主题浏览</h2>
        </div>
        <div class="filter-buttons" id="category-filters" aria-label="文章分类"></div>
        <div class="tag-filters" id="tag-filters" aria-label="文章标签"></div>
      </section>

      <section id="notes" class="notes-section">
        <div class="section-heading">
          <div>
            <p class="section-kicker">LATEST NOTES</p>
            <h2 id="result-title">最近文章</h2>
          </div>
          <div class="result-tools">
            <label for="sort-order">排序</label>
            <select id="sort-order" aria-label="文章日期排序">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
            </select>
            <p id="result-count" class="result-count"></p>
          </div>
        </div>
        <div id="post-list" class="post-grid" aria-live="polite"></div>
        <p id="empty-state" class="empty-state" hidden>没有找到相关文章。换个关键词或筛选条件试试。</p>
      </section>

      <section id="about" class="about">
        <p class="section-kicker">ABOUT</p>
        <h2>关于这本线上笔记</h2>
        <p>我是一个持续阅读、记录与整理生活的人。愿这里的文字能留住一点清醒，也和正在寻找同类感受的你相遇。</p>
        <a class="text-link" href="mailto:hello@example.com">写信给我 <span>↗</span></a>
      </section>
    </main>

    <footer>© <span id="year"></span> 微光札记 · 写给不急于抵达的日子</footer>
    <dialog id="article-dialog" aria-labelledby="article-title">
      <button class="dialog-close" aria-label="关闭文章">×</button>
      <article id="article-content"></article>
    </dialog>
    <script src="posts.js"></script>
    <script src="app.js"></script>
  </body>
</html>
